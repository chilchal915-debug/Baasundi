
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Private Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white}

/* LOGIN */
#loginBox{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:20px;
  gap:10px;
}
input{padding:14px;font-size:16px;border-radius:8px;border:none}
button{padding:12px;border:none;border-radius:8px;background:#ff4d6d;color:white}

/* CHAT */
#chatUI{display:none;height:100vh;flex-direction:column}
.header{background:#1f1f1f;padding:12px;text-align:center}

.status{display:flex;justify-content:space-between;padding:6px 12px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;opacity:.25}
.on{opacity:1}
.green{background:#00ff66}
.red{background:#ff3333}

#heart{opacity:.3}
.heart-on{opacity:1;text-shadow:0 0 8px #ff4d6d}

#chat{flex:1;overflow-y:auto;padding:10px}

/* bubbles */
.bubble{
  max-width:70%;
  padding:10px;
  border-radius:12px;
  margin:6px 0;
}
.me{background:#ff4d6d;margin-left:auto}
.them{background:#333}

.meta{font-size:11px;opacity:.7;text-align:right;margin-top:4px}

.input-box{display:flex;gap:6px;padding:8px;background:#1f1f1f;position:sticky;bottom:0}
.file-btn{background:#333}
.snap{border:2px dashed #ff4d6d}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h2>Login</h2>
<input id="usernameInput" placeholder="Username">
<input id="passwordInput" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
</div>

<!-- CHAT -->
<div id="chatUI">
<div class="header">Lucifer ❤️ Bassu</div>

<div class="status">
<div><span id="bassuDot" class="dot green"></span> bassu</div>
<div id="heart">❤️ Online</div>
<div><span id="luciferDot" class="dot red"></span> lucifer.rootx</div>
</div>

<div id="chat"></div>

<div class="input-box">
<input id="msg" placeholder="Type">
<button onclick="sendText()">Send</button>
<button onclick="sendSnap()">Snap</button>
<button onclick="toggleRec()">🎤</button>
</div>
</div>

<script>
/* ---------- USERS ---------- */

const USERS = {
 "lucifer.rootx":"basundi@123",
 "bassu":"basundi@123"
};

let me;

/* ---------- LOGIN ---------- */

function doLogin(){
 const u = usernameInput.value.toLowerCase().trim();
 const p = passwordInput.value;

 if(USERS[u] && USERS[u]===p){
   me=u;
   loginBox.style.display="none";
   chatUI.style.display="flex";
   startPeer();
 } else {
   alert("Invalid username or password");
 }
}

/* ---------- ENCRYPT ---------- */

const enc=t=>btoa(unescape(encodeURIComponent(t)));
const dec=t=>decodeURIComponent(escape(atob(t)));

/* ---------- PEER AUTO CONNECT ---------- */

let peer, conn;

function startPeer(){
 peer = new Peer(me==="bassu" ? "peerA" : "peerB");

 peer.on("open",()=>{
   if(me==="lucifer.rootx"){
     conn = peer.connect("peerA");
     setupConn();
   }
 });

 peer.on("connection",c=>{
   conn=c;
   setupConn();
 });
}

function setupConn(){
 setOnline(true);

 conn.on("data",d=>{
   if(d.type==="msg") addBubble(dec(d.text),false,d.id,d.snap);
   if(d.type==="seen") markSeen(d.id);
   if(d.type==="delete") removeMsg(d.id);
   if(d.type==="typing") showTyping(d.user,d.on);
 });

 conn.on("close",()=>setOnline(false));
}

/* ---------- ONLINE ---------- */

function setOnline(on){
 heart.classList.toggle("heart-on",on);
}

/* ---------- TYPING ---------- */

function showTyping(user,on){
 if(user==="bassu") bassuDot.classList.toggle("on",on);
 else luciferDot.classList.toggle("on",on);
}

msg.oninput=()=>{
 if(!conn) return;
 conn.send({type:"typing",user:me,on:true});
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>{
   conn.send({type:"typing",user:me,on:false});
 },600);
};

/* ---------- BUBBLES ---------- */

function addBubble(text,isMe,id,snap){
 const b=document.createElement("div");
 b.className="bubble "+(isMe?"me":"them")+(snap?" snap":"");
 b.dataset.id=id;

 b.innerHTML=text+`<div class="meta" id="m${id}">${isMe?"✓":""}</div>`;

 let sx=0;
 b.ontouchstart=e=>sx=e.touches[0].clientX;
 b.ontouchend=e=>{
   if(e.changedTouches[0].clientX-sx>120){
     removeMsg(id);
     conn?.send({type:"delete",id});
   }
 };

 chat.appendChild(b);
 chat.scrollTop=chat.scrollHeight;

 if(!isMe){
   conn.send({type:"seen",id});
   if(snap) setTimeout(()=>removeMsg(id),1200);
 }
}

/* ---------- SEEN ---------- */

function markSeen(id){
 const m=document.getElementById("m"+id);
 if(m) m.textContent="✓✓";
}

/* ---------- DELETE ---------- */

function removeMsg(id){
 const el=document.querySelector(`[data-id='${id}']`);
 if(el) el.remove();
}

/* ---------- SEND ---------- */

function sendText(){
 if(!conn) return;
 const t=msg.value.trim();
 if(!t) return;
 const id=Date.now();
 conn.send({type:"msg",text:enc(t),id});
 addBubble(t,true,id,false);
 msg.value="";
}

function sendSnap(){
 if(!conn) return;
 const t=msg.value.trim();
 if(!t) return;
 const id=Date.now();
 conn.send({type:"msg",text:enc(t),id,snap:true});
 addBubble(t,true,id,true);
 msg.value="";
}

/* ---------- VOICE ---------- */

let rec,chunks=[];
async function toggleRec(){
 if(!rec){
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(s);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
    const blob=new Blob(chunks);
    const r=new FileReader();
    r.onload=()=>sendVoice(r.result);
    r.readAsDataURL(blob);
    chunks=[]; rec=null;
  };
  rec.start();
 } else rec.stop();
}

function sendVoice(data){
 const id=Date.now();
 const html=`<audio controls src="${data}"></audio>`;
 conn.send({type:"msg",text:enc(html),id});
 addBubble(html,true,id,false);
}

/* ---------- KEYBOARD SAFE ---------- */

window.addEventListener("resize",()=>chat.scrollTop=chat.scrollHeight);
</script>

</body>
</html>
