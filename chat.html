<script>

let me, other, peer, conn;
let retryTimer = null;

go.onclick = () => {
  me = user.value.toLowerCase().trim();

  if (me !== "bassu" && me !== "lucifer") {
    alert("Use bassu or lucifer");
    return;
  }

  other = me === "bassu" ? "lucifer" : "bassu";

  login.style.display = "none";
  chatUI.style.display = "flex";

  startPeer();
};

function startPeer() {

  peer = new Peer(me, {
    host: "peerjs.com",
    port: 443,
    secure: true
  });

  peer.on("open", () => {
    status.textContent = "Online — auto connecting...";
    tryConnectLoop(); // start retry loop
  });

  peer.on("connection", c => {
    console.log("Incoming connection");
    setupConn(c);
  });

  peer.on("error", e => {
    console.log("Peer error:", e);
  });
}

/* ---------- AUTO RETRY CONNECT ---------- */

function tryConnectLoop() {
  if (retryTimer) clearInterval(retryTimer);

  retryTimer = setInterval(() => {
    if (conn && conn.open) {
      clearInterval(retryTimer);
      return;
    }

    console.log("Trying connect to", other);
    const c = peer.connect(other, { reliable: true });

    c.on("open", () => {
      setupConn(c);
      clearInterval(retryTimer);
    });

    c.on("error", () => {
      // ignore — next retry
    });

  }, 1500); // retry every 1.5 sec
}

/* ---------- SETUP CONNECTION ---------- */

function setupConn(c) {

  // agar already connected hai to extra connection close
  if (conn && conn.open) {
    c.close();
    return;
  }

  conn = c;

  conn.on("open", () => {
    status.textContent = "Connected ✅";
  });

  conn.on("data", d => {
    if (d.type === "msg") add(d.html, false);
  });

  conn.on("close", () => {
    status.textContent = "Disconnected — retrying...";
    tryConnectLoop();
  });
}

/* ---------- UI ---------- */

function add(html, isMe) {
  const b = document.createElement("div");
  b.className = "bubble " + (isMe ? "me" : "them");
  b.innerHTML = html;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- SEND TEXT ---------- */

send.onclick = () => {
  if (!conn || !conn.open) return alert("Not connected yet");

  const t = msg.value.trim();
  if (!t) return;

  add(t, true);
  conn.send({ type: "msg", html: t });
  msg.value = "";
};

/* ---------- IMAGE ---------- */

img.onclick = () => file.click();

file.onchange = e => {
  const f = e.target.files[0];
  if (!f) return;

  const r = new FileReader();
  r.onload = () => {
    const html = `<img src="${r.result}">`;
    add(html, true);
    conn.send({ type: "msg", html });
  };
  r.readAsDataURL(f);
};

/* ---------- VOICE ---------- */

let rec, chunks = [];

voice.onclick = async () => {

  if (!rec) {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(s);

    rec.ondataavailable = e => chunks.push(e.data);

    rec.onstop = () => {
      const blob = new Blob(chunks, { type: "audio/webm" });
      chunks = [];

      const r = new FileReader();
      r.onload = () => {
        const html = `<audio controls src="${r.result}"></audio>`;
        add(html, true);
        conn.send({ type: "msg", html });
      };
      r.readAsDataURL(blob);
    };

    rec.start();
    voice.textContent = "⏹";

  } else {
    rec.stop();
    rec = null;
    voice.textContent = "🎤";
  }
};

</script>
