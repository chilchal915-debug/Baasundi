<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P2P Auto Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
 --bg:#0f0f0f; --panel:#1f1f1f; --me:#ff4d6d; --them:#333; --text:#fff;
}
.light{
 --bg:#f5f5f5; --panel:#fff; --them:#e4e4e4; --text:#000;
}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
#loginBox{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;gap:10px}
input,button{padding:14px;font-size:16px;border-radius:10px;border:none}
button{background:#ff4d6d;color:white}

#chatUI{display:none;height:100vh;flex-direction:column}
.header{background:var(--panel);padding:10px;display:flex;justify-content:space-between}

#chat{flex:1;overflow-y:auto;padding:10px}
.bubble{max-width:75%;padding:10px;border-radius:14px;margin:6px 0;word-wrap:break-word}
.me{background:var(--me);margin-left:auto;color:white}
.them{background:var(--them)}
.meta{font-size:11px;opacity:.7;text-align:right;margin-top:4px}

.input-box{display:flex;gap:6px;padding:8px;background:var(--panel)}
img,audio{max-width:100%;border-radius:8px}

#emojiBox{display:none;background:var(--panel);padding:8px;font-size:22px}
</style>
</head>

<body>

<div id="loginBox">
<h3>P2P Chat</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<input id="room" placeholder="Room name">
<button id="go">Enter</button>
</div>

<div id="chatUI">
<div class="header">
<span id="title"></span>
<div>
<button id="themeBtn">🌓</button>
<button id="emojiBtn">😊</button>
</div>
</div>

<div id="chat"></div>
<div id="emojiBox">😀 😁 😂 😍 😎 😢 😡 👍 ❤️ 🔥 🎉</div>

<div class="input-box">
<input id="msg" placeholder="Message">
<button id="send">Send</button>
<button id="voiceBtn">🎤</button>
<input type="file" id="file" hidden accept="image/*">
<button id="imgBtn">📷</button>
</div>
</div>

<script>

/* ---------- HASH LOGIN ---------- */

async function hash(t){
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
 return btoa(String.fromCharCode(...new Uint8Array(b)));
}

async function loginOK(u,p){
 const k="u_"+u;
 const h=await hash(p);
 if(!localStorage[k]) localStorage[k]=h;
 return localStorage[k]===h;
}

/* ---------- STATE ---------- */

let me, room, peer, conns={}, isHost=false;

/* ---------- LOGIN ---------- */

go.onclick=async()=>{
 if(await loginOK(user.value,pass.value)){
   me=user.value.trim().toLowerCase();
   room=room.value.trim().toLowerCase();
   title.textContent="Room: "+room;
   loginBox.style.display="none";
   chatUI.style.display="flex";
   loadHist();
   startPeer();
 } else alert("Wrong password");
};

/* ---------- STORAGE ---------- */

const sk=()=> "hist_"+room+"_"+me;
const saveHist=()=>localStorage.setItem(sk(),chat.innerHTML);
const loadHist=()=>chat.innerHTML=localStorage.getItem(sk())||"";

/* ---------- PEER AUTO HOST ---------- */

function startPeer(){

 const tryId = room+"_HOST";

 peer=new Peer(tryId,{host:"peerjs.com",port:443,secure:true});

 peer.on("open",()=>{ isHost=true; });

 peer.on("error",()=>{
   peer=new Peer(room+"_"+Math.random().toString(36).slice(2,6),
     {host:"peerjs.com",port:443,secure:true});

   peer.on("open",()=>{
     const c=peer.connect(room+"_HOST");
     c.on("open",()=>bind(c));
   });
 });

 peer.on("connection",bind);
}

function bind(c){
 conns[c.peer]=c;
 c.on("data",recv);
 c.on("close",()=>delete conns[c.peer]);
}

/* ---------- SEND ALL ---------- */

function sendAll(o){
 Object.values(conns).forEach(c=>c.open&&c.send(o));
}

/* ---------- ENCODE ---------- */

const enc=t=>btoa(unescape(encodeURIComponent(t)));
const dec=t=>decodeURIComponent(escape(atob(t)));

/* ---------- RECEIVE ---------- */

function recv(d){

 if(d.type==="msg"){
   add(dec(d.text),false,d.id,d.user);
   sendAll({type:"seen",id:d.id});
 }

 if(d.type==="seen") setMeta(d.id,"👁");

 if(d.type==="edit") editMsg(d.id,dec(d.text));
 if(d.type==="del") delMsg(d.id);
}

/* ---------- UI MSG ---------- */

function ts(){
 return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function add(t,meFlag,id,u){
 const b=document.createElement("div");
 b.className="bubble "+(meFlag?"me":"them");
 b.dataset.id=id;
 b.innerHTML=t+`<div class="meta" id="m${id}">
 ${meFlag?"✓":u} • ${ts()}</div>`;

 if(meFlag){
   b.oncontextmenu=e=>{
     e.preventDefault();
     const nt=prompt("Edit:",t);
     if(nt){ editMsg(id,nt); sendAll({type:"edit",id,text:enc(nt)}); }
   };
   b.ondblclick=()=>{
     delMsg(id);
     sendAll({type:"del",id});
   };
 }

 chat.appendChild(b);
 chat.scrollTop=chat.scrollHeight;
 saveHist();
}

function editMsg(id,t){
 const el=document.querySelector(`[data-id='${id}']`);
 if(el) el.childNodes[0].nodeValue=t;
 saveHist();
}

function delMsg(id){
 document.querySelector(`[data-id='${id}']`)?.remove();
 saveHist();
}

function setMeta(id,x){
 const m=document.getElementById("m"+id);
 if(m) m.textContent=x+" • "+ts();
}

/* ---------- SEND TEXT ---------- */

send.onclick=sendText;
msg.onkeypress=e=>{ if(e.key==="Enter") sendText(); };

function sendText(){
 const t=msg.value.trim();
 if(!t) return;
 const id=Date.now();
 add(t,true,id,me);
 sendAll({type:"msg",text:enc(t),id,user:me});
 msg.value="";
}

/* ---------- IMAGE RESIZE ---------- */

imgBtn.onclick=()=>file.click();

file.onchange=e=>{
 const f=e.target.files[0];
 if(!f) return;
 const img=new Image();
 const r=new FileReader();

 r.onload=ev=>img.src=ev.target.result;

 img.onload=()=>{
   const c=document.createElement("canvas");
   const max=900;
   let w=img.width,h=img.height;
   if(w>max){ h*=max/w; w=max; }
   c.width=w; c.height=h;
   c.getContext("2d").drawImage(img,0,0,w,h);

   const data=c.toDataURL("image/jpeg",0.7);
   const html=`<img src="${data}">`;
   const id=Date.now();
   add(html,true,id,me);
   sendAll({type:"msg",text:enc(html),id,user:me});
 };

 r.readAsDataURL(f);
};

/* ---------- VOICE ---------- */

let rec, chunks=[];
voiceBtn.onclick=async()=>{
 if(!rec){
   const s=await navigator.mediaDevices.getUserMedia({audio:true});
   rec=new MediaRecorder(s);
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=()=>{
     const blob=new Blob(chunks,{type:"audio/webm"});
     chunks=[];
     const r=new FileReader();
     r.onload=()=>{
       const html=`<audio controls src="${r.result}"></audio>`;
       const id=Date.now();
       add(html,true,id,me);
       sendAll({type:"msg",text:enc(html),id,user:me});
     };
     r.readAsDataURL(blob);
   };
   rec.start();
   voiceBtn.textContent="⏹";
 } else {
   rec.stop();
   rec=null;
   voiceBtn.textContent="🎤";
 }
};

/* ---------- EMOJI ---------- */

emojiBtn.onclick=()=>emojiBox.style.display=
 emojiBox.style.display==="block"?"none":"block";

emojiBox.onclick=e=>{
 if(e.target.textContent) msg.value+=e.target.textContent;
};

/* ---------- THEME ---------- */

themeBtn.onclick=()=>document.body.classList.toggle("light");

</script>
</body>
</html>
