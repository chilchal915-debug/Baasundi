<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Private Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white}
#loginBox{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;gap:10px}
input{padding:14px;font-size:16px;border-radius:8px;border:none}
button{padding:12px;border:none;border-radius:8px;background:#ff4d6d;color:white}

#chatUI{display:none;height:100vh;flex-direction:column}
.header{background:#1f1f1f;padding:12px;text-align:center}

.status{display:flex;justify-content:space-between;padding:6px 12px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;opacity:.25}
.dot.on{opacity:1}
.green{background:#00ff66}
.red{background:#ff3333}

#heart{opacity:.3}
.heart-on{opacity:1;text-shadow:0 0 8px #ff4d6d}

#chat{flex:1;overflow-y:auto;padding:10px}

.bubble{max-width:70%;padding:10px;border-radius:12px;margin:6px 0;word-wrap:break-word}
.me{background:#ff4d6d;margin-left:auto}
.them{background:#333}
.meta{font-size:11px;opacity:.7;text-align:right;margin-top:4px}

.input-box{display:flex;gap:6px;padding:8px;background:#1f1f1f;position:sticky;bottom:0}
.file-btn{background:#333}
img{max-width:100%;border-radius:8px}
</style>
</head>

<body>

<div id="loginBox">
<h2>Login</h2>
<input id="usernameInput" placeholder="Username">
<input id="passwordInput" type="password" placeholder="Password">
<button onclick="doLogin()">Login</button>
</div>

<div id="chatUI">
<div class="header">Private Chat</div>

<div class="status">
<div><span id="bassuDot" class="dot green"></span> bassu</div>
<div id="heart">❤️ Online</div>
<div><span id="luciferDot" class="dot red"></span> lucifer.rootx</div>
</div>

<div id="chat"></div>

<div class="input-box">
<input id="msg" placeholder="Type">
<button onclick="sendText()">Send</button>
<input type="file" id="fileInput" hidden accept="image/*">
<button class="file-btn" onclick="fileInput.click()">📷</button>
</div>
</div>

<script>
/* ---------- USERS ---------- */

const USERS={
 "lucifer.rootx":"basundi@123",
 "bassu":"basundi@123"
};

let me;
const STORE_KEY="snap_history";

/* ---------- LOGIN ---------- */

function doLogin(){
 const u=usernameInput.value.toLowerCase().trim();
 if(USERS[u]===passwordInput.value){
   me=u;
   loginBox.style.display="none";
   chatUI.style.display="flex";
   loadHistory();
   startPeer();
 } else alert("Invalid login");
}

/* ---------- HISTORY ---------- */

function saveHistory(){
 localStorage.setItem(STORE_KEY,chat.innerHTML);
}
function loadHistory(){
 chat.innerHTML=localStorage.getItem(STORE_KEY)||"";
}

/* ---------- ENCRYPT ---------- */

const enc=t=>btoa(unescape(encodeURIComponent(t)));
const dec=t=>decodeURIComponent(escape(atob(t)));

/* ---------- PEER ---------- */

let peer,conn,retryTimer;

function startPeer(){
 const myId = me==="bassu" ? "peerA" : "peerB";
 const otherId = me==="bassu" ? "peerB" : "peerA";

 peer=new Peer(myId);

 peer.on("open",()=>tryConnect(otherId));
 peer.on("connection",c=>bindConn(c));
 peer.on("disconnected",reconnect);
 peer.on("error",reconnect);
}

function tryConnect(otherId){
 if(conn?.open) return;
 const c=peer.connect(otherId);
 c.on("open",()=>bindConn(c));
}

function reconnect(){
 setOnline(false);
 clearTimeout(retryTimer);
 retryTimer=setTimeout(()=>{
   peer.reconnect();
   startPeer();
 },1500);
}

function bindConn(c){
 conn=c;
 setupConn();
}

/* ---------- CONNECTION ---------- */

function setupConn(){
 setOnline(true);

 conn.on("data",d=>{
   if(d.type==="msg"){
     addBubble(dec(d.text),false,d.id);
     conn.send({type:"delivered",id:d.id});
   }
   if(d.type==="delivered") setMeta(d.id,"✓✓");
   if(d.type==="seen") seenAndDelete(d.id);
   if(d.type==="typing") showTyping(d.user,d.on);
 });

 conn.on("close",reconnect);
}

/* ---------- STATUS ---------- */

function setOnline(on){
 heart.classList.toggle("heart-on",on);
}

/* ---------- TYPING ---------- */

msg.oninput=()=>{
 if(!conn?.open) return;
 conn.send({type:"typing",user:me,on:true});
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>conn?.send({type:"typing",user:me,on:false}),600);
};

function showTyping(user,on){
 if(user==="bassu") bassuDot.classList.toggle("on",on);
 else luciferDot.classList.toggle("on",on);
}

/* ---------- BUBBLES ---------- */

function addBubble(text,isMe,id){
 const b=document.createElement("div");
 b.className="bubble "+(isMe?"me":"them");
 b.dataset.id=id;
 b.innerHTML=text+`<div class="meta" id="m${id}">${isMe?"✓":""}</div>`;
 chat.appendChild(b);
 chat.scrollTop=chat.scrollHeight;
 saveHistory();

 if(!isMe){
   conn?.send({type:"seen",id});
 }
}

function setMeta(id,txt){
 const m=document.getElementById("m"+id);
 if(m) m.textContent=txt;
}

function seenAndDelete(id){
 setMeta(id,"👁");
 setTimeout(()=>{
   removeMsg(id);
 },1200);
}

function removeMsg(id){
 document.querySelector(`[data-id='${id}']`)?.remove();
 saveHistory();
}

/* ---------- SEND ---------- */

function sendText(){
 if(!conn?.open) return;
 const t=msg.value.trim();
 if(!t) return;
 const id=Date.now();
 conn.send({type:"msg",text:enc(t),id});
 addBubble(t,true,id);
 msg.value="";
}

/* ---------- IMAGE ---------- */

fileInput.onchange=e=>{
 const f=e.target.files[0];
 if(!f||!conn?.open) return;
 const r=new FileReader();
 r.onload=()=>{
   const html=`<img src="${r.result}">`;
   const id=Date.now();
   conn.send({type:"msg",text:enc(html),id});
   addBubble(html,true,id);
 };
 r.readAsDataURL(f);
};

</script>
</body>
</html>
