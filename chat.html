
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Private Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  background:#1f1f1f;
  padding:12px;
  text-align:center;
  font-size:18px;
}

.statusbar{
  display:flex;
  justify-content:space-between;
  padding:6px 12px;
  font-size:14px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:6px;
}

.green{background:#00ff66;}
.red{background:#ff3333;}
.gray{background:#555;}

#heart{
  font-size:20px;
  opacity:.3;
  transition:.3s;
}
.heart-on{
  opacity:1;
  text-shadow:0 0 10px #ff4d6d;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg img,.msg video,.msg audio{
  max-width:220px;
  border-radius:8px;
}

.input-box{
  display:flex;
  gap:6px;
  padding:8px;
  background:#1f1f1f;
  position:sticky;
  bottom:0;
}

#msg{
  flex:1;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
}
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#ff4d6d;
  color:white;
}
.file-btn{background:#333;}
</style>
</head>

<body>

<div class="header">
  Lucifer ❤️ Bassu
</div>

<div class="statusbar">
  <div>
    <span class="dot green" id="bassuDot"></span>
    Bassu <span id="bassuTyping"></span>
  </div>

  <div id="heart">❤️ Online</div>

  <div>
    <span class="dot red" id="luciferDot"></span>
    Lucifer.rootx <span id="luciferTyping"></span>
  </div>
</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type...">
  <button onclick="sendText()">Send</button>

  <input type="file" id="imgInput" hidden accept="image/*">
  <button class="file-btn" onclick="imgInput.click()">📷</button>

  <input type="file" id="videoInput" hidden accept="video/*">
  <button class="file-btn" onclick="videoInput.click()">🎬</button>

  <input type="file" id="audioInput" hidden accept="audio/*">
  <button class="file-btn" onclick="audioInput.click()">🎵</button>
</div>

<script>
/* ---------- USER NAME ---------- */
const me = prompt("Enter name: bassu or lucifer").toLowerCase();

/* ---------- AUTO CONNECT ---------- */
const ROOM = "lucifer-bassu-room";
const peer = new Peer(me === "bassu" ? "peerA" : "peerB");
let conn;

peer.on("open", ()=>{
  if(me === "lucifer"){
    conn = peer.connect("peerA");
    setup();
  }
});

peer.on("connection", c=>{
  conn = c;
  setup();
});

/* ---------- CHAT ---------- */
const chat = document.getElementById("chat");

function add(html){
  const d=document.createElement("div");
  d.className="msg";
  d.innerHTML=html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- CONNECTION ---------- */
function setup(){
  heart.classList.add("heart-on");

  conn.on("data", d=>{
    if(d.type==="text") add("👤 "+d.text);
    if(d.type==="image") add(`<img src="${d.data}">`);
    if(d.type==="video") add(`<video controls src="${d.data}"></video>`);
    if(d.type==="audio") add(`<audio controls src="${d.data}"></audio>`);

    if(d.type==="typing"){
      if(d.user==="bassu"){
        bassuTyping.textContent = d.on ? "typing..." : "";
      } else {
        luciferTyping.textContent = d.on ? "typing..." : "";
      }
    }
  });

  conn.on("close", ()=>{
    heart.classList.remove("heart-on");
  });
}

/* ---------- TEXT SEND ---------- */
function sendText(){
  if(!conn) return;
  const t = msg.value.trim();
  if(!t) return;
  conn.send({type:"text",text:t});
  add("🧑 "+t);
  msg.value="";
}

/* ---------- TYPING ---------- */
msg.oninput = ()=>{
  if(!conn) return;
  conn.send({type:"typing", user:me, on:true});
  clearTimeout(window.typingTimer);
  window.typingTimer = setTimeout(()=>{
    conn.send({type:"typing", user:me, on:false});
  },800);
};

/* ---------- FILE ---------- */
function sendFile(f,type){
  const r=new FileReader();
  r.onload=()=>{
    conn.send({type:type,data:r.result});
    if(type==="image") add(`<img src="${r.result}">`);
    if(type==="video") add(`<video controls src="${r.result}"></video>`);
    if(type==="audio") add(`<audio controls src="${r.result}"></audio>`);
  };
  r.readAsDataURL(f);
}

imgInput.onchange=e=> sendFile(e.target.files[0],"image");
videoInput.onchange=e=> sendFile(e.target.files[0],"video");
audioInput.onchange=e=> sendFile(e.target.files[0],"audio");

/* ---------- KEEP INPUT VISIBLE ---------- */
msg.focus();
window.addEventListener("resize", ()=>{
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
