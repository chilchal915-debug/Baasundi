<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Private Chat</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  text-align:center;
  padding:18px;
  font-size:22px;
  background:#1f1f1f;
}

#chat{
  flex:1;
  padding:12px;
  overflow-y:auto;
  font-size:18px;
}

.msg{
  margin:8px 0;
}

.msg img, .msg video, .msg audio{
  max-width:220px;
  border-radius:10px;
  margin-top:5px;
}

.input-box{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  background:#1f1f1f;
  padding:8px;
}

#msg{
  flex:1;
  padding:12px;
  border:none;
  outline:none;
  font-size:16px;
  border-radius:8px;
}

button{
  padding:12px;
  border:none;
  background:#ff4d6d;
  color:#fff;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}

.file-btn{
  background:#333;
}
</style>
</head>

<body>

<div class="header">Private Chat</div>

<div id="chat"></div>

<div class="input-box">
  <input id="msg" placeholder="Type message...">
  <button onclick="sendText()">Send</button>

  <input type="file" id="imgInput" accept="image/*" hidden>
  <button class="file-btn" onclick="imgInput.click()">📷</button>

  <input type="file" id="videoInput" accept="video/*" hidden>
  <button class="file-btn" onclick="videoInput.click()">🎬</button>

  <input type="file" id="audioInput" accept="audio/*" hidden>
  <button class="file-btn" onclick="audioInput.click()">🎵</button>

  <button id="recordBtn" class="file-btn">🎤</button>
</div>

<script>
const chat = document.getElementById("chat");

function addMessage(html){
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- PEER SETUP ---------- */

const peer = new Peer();
let conn;

peer.on("open", id=>{
  const other = prompt("Enter other user ID");
  if(other){
    conn = peer.connect(other);
    setupConn();
  }
});

peer.on("connection", c=>{
  conn = c;
  setupConn();
});

function setupConn(){
  conn.on("data", data=>{
    if(data.type === "text"){
      addMessage("👤 "+data.text);
    }
    if(data.type === "image"){
      addMessage(`<img src="${data.data}">`);
    }
    if(data.type === "video"){
      addMessage(`<video controls src="${data.data}"></video>`);
    }
    if(data.type === "audio"){
      addMessage(`<audio controls src="${data.data}"></audio>`);
    }
  });
}

/* ---------- TEXT ---------- */

function sendText(){
  const m = msg.value.trim();
  if(!m || !conn) return;
  conn.send({type:"text", text:m});
  addMessage("🧑 "+m);
  msg.value="";
}

/* ---------- FILE SEND ---------- */

function sendFile(file, type){
  const reader = new FileReader();
  reader.onload = ()=>{
    conn.send({type:type, data:reader.result});
    if(type==="image") addMessage(`<img src="${reader.result}">`);
    if(type==="video") addMessage(`<video controls src="${reader.result}"></video>`);
    if(type==="audio") addMessage(`<audio controls src="${reader.result}"></audio>`);
  };
  reader.readAsDataURL(file);
}

imgInput.onchange = e=>{
  if(conn) sendFile(e.target.files[0],"image");
};

videoInput.onchange = e=>{
  if(conn) sendFile(e.target.files[0],"video");
};

audioInput.onchange = e=>{
  if(conn) sendFile(e.target.files[0],"audio");
};

/* ---------- VOICE RECORD ---------- */

let recorder;
let chunks = [];

recordBtn.onclick = async ()=>{
  if(!recorder){
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = e=>chunks.push(e.data);

    recorder.onstop = ()=>{
      const blob = new Blob(chunks,{type:"audio/webm"});
      chunks=[];
      sendFile(blob,"audio");
      recorder=null;
      recordBtn.textContent="🎤";
    };

    recorder.start();
    recordBtn.textContent="⏹";
  } else {
    recorder.stop();
  }
};
</script>

</body>
</html>
