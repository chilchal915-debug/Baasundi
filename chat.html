<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auto P2P Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#111;color:white}
#login{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px;gap:10px}
input,button{padding:14px;border:none;border-radius:10px;font-size:16px}
button{background:#ff4d6d;color:white}
#chatUI{display:none;height:100vh;flex-direction:column}
.header{background:#222;padding:10px;text-align:center}
#chat{flex:1;overflow:auto;padding:10px}
.bubble{max-width:75%;padding:10px;border-radius:14px;margin:6px 0}
.me{background:#ff4d6d;margin-left:auto}
.them{background:#333}
.meta{font-size:11px;opacity:.7;text-align:right}
.input{display:flex;gap:6px;padding:8px;background:#222}
img,audio{max-width:100%}
</style>
</head>

<body>

<div id="login">
<h3>Auto Chat Login</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button id="go">Enter</button>
</div>

<div id="chatUI">
<div class="header" id="title"></div>
<div id="chat"></div>
<div class="input">
<input id="msg" placeholder="Message">
<button id="send">Send</button>
<button id="voice">🎤</button>
<input type="file" id="file" hidden accept="image/*">
<button id="img">📷</button>
</div>
</div>

<script>

/* ---------- AUTO ROOM FROM URL ---------- */

const params = new URLSearchParams(location.search);
const room = params.get("room") || "basundi";
title.textContent="Room: "+room;

/* ---------- HASH LOGIN ---------- */

async function hash(t){
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
 return btoa(String.fromCharCode(...new Uint8Array(b)));
}

async function ok(u,p){
 const k="u_"+u;
 const h=await hash(p);
 if(!localStorage[k]) localStorage[k]=h;
 return localStorage[k]===h;
}

/* ---------- STATE ---------- */

let me, peer, conns={};

/* ---------- LOGIN ---------- */

go.onclick=async()=>{
 if(await ok(user.value,pass.value)){
   me=user.value;
   login.style.display="none";
   chatUI.style.display="flex";
   load();
   startPeer();
 } else alert("Wrong password");
};

/* ---------- STORAGE ---------- */

const sk=()=> "hist_"+room+"_"+me;
const save=()=>localStorage.setItem(sk(),chat.innerHTML);
const load=()=>chat.innerHTML=localStorage.getItem(sk())||"";

/* ---------- PEER AUTO ---------- */

function startPeer(){

 peer=new Peer(room+"_HOST",{host:"peerjs.com",port:443,secure:true});

 peer.on("open",()=>{});

 peer.on("error",()=>{
   peer=new Peer(room+"_"+Math.random().toString(36).slice(2,6),
     {host:"peerjs.com",port:443,secure:true});

   peer.on("open",()=>{
     const c=peer.connect(room+"_HOST");
     c.on("open",()=>bind(c));
   });
 });

 peer.on("connection",bind);
}

function bind(c){
 conns[c.peer]=c;
 c.on("data",recv);
}

/* ---------- SEND ALL ---------- */

function sendAll(o){
 Object.values(conns).forEach(c=>c.open&&c.send(o));
}

/* ---------- ENCODE ---------- */

const enc=t=>btoa(unescape(encodeURIComponent(t)));
const dec=t=>decodeURIComponent(escape(atob(t)));

/* ---------- RECEIVE ---------- */

function recv(d){
 if(d.type==="msg"){
   add(dec(d.text),false,d.id,d.user);
   sendAll({type:"seen",id:d.id});
 }
 if(d.type==="seen") meta(d.id,"👁");
}

/* ---------- UI ---------- */

function ts(){
 return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function add(t,mef,id,u){
 const b=document.createElement("div");
 b.className="bubble "+(mef?"me":"them");
 b.dataset.id=id;
 b.innerHTML=t+`<div class="meta" id="m${id}">
 ${mef?"✓":u} • ${ts()}</div>`;
 chat.appendChild(b);
 chat.scrollTop=999999;
 save();
}

function meta(id,x){
 const m=document.getElementById("m"+id);
 if(m) m.textContent=x+" • "+ts();
}

/* ---------- SEND ---------- */

send.onclick=()=>{
 const t=msg.value.trim();
 if(!t) return;
 const id=Date.now();
 add(t,true,id,me);
 sendAll({type:"msg",text:enc(t),id,user:me});
 msg.value="";
};

/* ---------- IMAGE ---------- */

img.onclick=()=>file.click();

file.onchange=e=>{
 const f=e.target.files[0];
 if(!f) return;
 const r=new FileReader();
 r.onload=()=>{
   const html=`<img src="${r.result}">`;
   const id=Date.now();
   add(html,true,id,me);
   sendAll({type:"msg",text:enc(html),id,user:me});
 };
 r.readAsDataURL(f);
};

/* ---------- VOICE ---------- */

let rec,chunks=[];
voice.onclick=async()=>{
 if(!rec){
   const s=await navigator.mediaDevices.getUserMedia({audio:true});
   rec=new MediaRecorder(s);
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=()=>{
     const blob=new Blob(chunks,{type:"audio/webm"});
     chunks=[];
     const r=new FileReader();
     r.onload=()=>{
       const html=`<audio controls src="${r.result}"></audio>`;
       const id=Date.now();
       add(html,true,id,me);
       sendAll({type:"msg",text:enc(html),id,user:me});
     };
     r.readAsDataURL(blob);
   };
   rec.start();
   voice.textContent="⏹";
 } else {
   rec.stop();
   rec=null;
   voice.textContent="🎤";
 }
};

</script>
</body>
</html>
